# MQTT Broker (Home Assistant Mosquitto recommended)
mqtt:
  host: "ha.delrobco.com"
  port: 1883
  username: ""
  password: ""
  topic_prefix: "dino/player"

media_dir: "/opt/dino-media-player/media"
volume: 80

# Mix stereo down to one channel. Keep this on while only the left speaker is wired.
downmix_mono: true

# Default output key (must match an entry under outputs:)
output: analog

outputs:
  analog:
    label: "3.5mm jack"
    audio_output: alsa
    audio_device: "alsa/plughw:2,0"
  bluetooth:
    label: "BT-WUZHI"
    audio_output: alsa
    # MAC is filled in after pairing; the player can also resolve BT-WUZHI by name.
    audio_device: "alsa/bluealsa"
    bluetooth_name: "BT-WUZHI"
    bluetooth_mac: ""
