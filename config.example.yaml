# MQTT Broker (Home Assistant Mosquitto recommended)
mqtt:
  host: "ha.delrobco.com"          # or the ZeroTier IP / hostname of your HA
  port: 1883
  username: ""                    # if required
  password: ""
  topic_prefix: "dino/player"

media_dir: "/opt/dino-media-player/media"

volume: 80

# Use ALSA on headless Trixie. PipeWire is not configured for the dino user.
audio_output: "alsa"

# Pi 4 analog jack is usually card 2 (bcm2835 Headphones).
# HDMI is card 0/1 and fails with ALSA error 524 when nothing is plugged in.
audio_device: "alsa/plughw:2,0"
